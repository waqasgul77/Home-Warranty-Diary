name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Add Android platform
      run: npx cap add android

    - name: Target latest Android API level (Play Store requirement)
      run: python3 scripts/configure_target_sdk.py

    - name: Configure AdMob App ID
      run: python3 scripts/configure_admob.py

    - name: Generate app & notification icons from assets/
      run: npx capacitor-assets generate --android --assetPath assets

    - name: Install custom notification icon
      run: |
        mkdir -p android/app/src/main/res/drawable
        cp assets/ic_stat_icon.png android/app/src/main/res/drawable/ic_stat_icon.png

    - name: Sync Capacitor web assets into the Android project
      run: npx cap sync android

    - name: Decode Release Keystore (fixed, reused every build)
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release-key.jks

    - name: Configure release signing in build.gradle
      run: python3 scripts/configure_signing.py

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build Signed Release AAB
      working-directory: android
      env:
        RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.ALIAS_NAME }}
        RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload Generated AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab-file
        path: android/app/build/outputs/bundle/release/app-release.aab
